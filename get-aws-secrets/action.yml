name: 'Get secrets from AWS'
description: 'Securely get secrets from AWS Secrets Manager'

inputs:
  role-to-assume:
    description: 'Which role to use to retrieve secrets'
    required: true
  secret-ids:
    description: 'Which secrets to get'
    required: true
  region:
    description: 'AWS region'
    required: false
    default: 'eu-central-1'

runs:
  using: "composite"
  steps:
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.region }}
    - name: get secrets
      uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
      with:
        secret-ids: ${{ inputs.secret-ids }}
